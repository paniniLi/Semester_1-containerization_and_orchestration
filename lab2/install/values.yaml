app:
  name: lab2-api

image:
  repository: lab2-api
  tag: "1.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

logs:
  collect: true

service:
  type: NodePort
  port: 8080 # порт внутри контейнера
  nodePort: 30080 # порт сервиса, куда необходимо слать запросы к приложению

tracing:
  enabled: true
  otlpEndpoint: http://monitoring-jaeger.monitoring.svc.cluster.local:4318

grafana:
  enabled: true
  rbac:
    namespaced: true
  service:
    type: NodePort
    port: 80
    nodePort: 30000
  persistence:
    enabled: false

## Параметры аутентификации задаются в файле grafana-secret.values.yaml и передаются в параметры обновления Helm-релиза.
## По-умолчанию аутентификация отключена.
grafanaCredentials:
  create: false
  username: ""
  password: ""

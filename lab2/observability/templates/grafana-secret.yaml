{{- if .Values.grafanaCredentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "grafana.admin.existingSecret must be set" .Values.grafana.admin.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.grafana.admin.userKey }}: {{ required "grafanaCredentials.username must be set" .Values.grafanaCredentials.username | quote }}
  {{ .Values.grafana.admin.passwordKey }}: {{ required "grafanaCredentials.password must be set" .Values.grafanaCredentials.password | quote }}
{{- end }}

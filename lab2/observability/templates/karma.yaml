apiVersion: apps/v1
kind: Deployment
metadata:
  name: karma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karma
  template:
    metadata:
      labels:
        app: karma
    spec:
      containers:
        - name: karma
          image: ghcr.io/prymitive/karma:v0.132
          env:
            - name: ALERTMANAGER_URI
              value: http://monitoring-alertmanager.monitoring.svc.cluster.local:9093
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: karma
spec:
  type: NodePort
  selector:
    app: karma
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
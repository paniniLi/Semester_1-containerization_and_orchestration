##########################################
## Параметры приложения API
##########################################
api:
  image:
    repository: lab3-api
    version: "1.0"
    pullPolicy: IfNotPresent
  instances: 4
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  wait_for_schema_migrations:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  service:
    port: 8080
    type: NodePort
    nodePort: 30082
  health_fail: false

##########################################
## Параметры приложения Worker
##########################################
worker:
  image:
    repository: lab3-worker
    version: "1.0"
    pullPolicy: IfNotPresent
  instances: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  wait_for_schema_migrations:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  service:
    port: 8080
    type: NodePort
    nodePort: 30083

##########################################
## Параметры СУДБ Postgres
##########################################
postgres:
  instances: 1
  database: shop
  owner: shop
  storage:
    size: 1Gi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi


##########################################
## Параметры Job по миграции схем данных
##########################################
migrations:
  image:
    repository: lab3-migration
    version: "1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  backoffLimit: 6
  activeDeadlineSeconds: 600

##########################################
## Prometheus Operator compatibility
##########################################
monitoring:
  prometheusOperator:
    enabled: false

##########################################
## Параметры NetworkPolicy
##########################################
networkPolicy:
  enabled: true

  policies:
    default-deny: # запрещаем весь входящий и исходящий трафик
      podSelector: {} # политика default-deny применяется ко всем подам в текущем namespace
      policyTypes:
        - Ingress # входящий трафик
        - Egress # исходящий трафик
      ingress: []
      egress: []

    allow-dns: # разрешаем весь исходящий трафик на CoreDNS
      podSelector: {}
      policyTypes:
        - Egress
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53

    # Политика API
    api:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: shop-api
          app.kubernetes.io/part-of: shop
      policyTypes:
        - Ingress
        - Egress

      ingress: # входящий трафик принимается от всех клиентов
        - ports:
            - protocol: TCP
              port: 8080

      egress: # исходящий трафик допускается только на PostgreSQL
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: shop-postgres
                  app.kubernetes.io/part-of: shop
          ports:
            - protocol: TCP
              port: 5432

    # Политика worker
    worker:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: shop-worker
          app.kubernetes.io/part-of: shop
      policyTypes:
        - Ingress
        - Egress

      ingress: # входящий трафик принимается от всех клиентов
        - ports:
            - protocol: TCP
              port: 8080

      egress: # исходящий трафик допускается только на PostgreSQL
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: shop-postgres
                  app.kubernetes.io/part-of: shop
          ports:
            - protocol: TCP
              port: 5432

    # Политика миграции схемы
    schema-migration:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: shop-schema-migration
          app.kubernetes.io/part-of: shop
      policyTypes:
        - Ingress
        - Egress

      ingress: [] # входящий трафик запрещен

      egress: # исходящий трафик допускается только на PostgreSQL
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: shop-postgres
                  app.kubernetes.io/part-of: shop
          ports:
            - protocol: TCP
              port: 5432

      # Политика PostgreSQL
    postgres:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: shop-postgres
          app.kubernetes.io/part-of: shop
      policyTypes:
        - Ingress
        - Egress

      ingress:
        - from: # разрешен входящий трафик со стороны api, worker и job по миграции схем
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: shop-api
                  app.kubernetes.io/part-of: shop

            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: shop-worker
                  app.kubernetes.io/part-of: shop

            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: shop-schema-migration
                  app.kubernetes.io/part-of: shop
          ports:
            - protocol: TCP
              port: 5432

        - from: # разрешен входящий трафик со стороны CloudNativePG operator для обращения к instance manager
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: cnpg-system
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: cloudnative-pg
          ports:
            - protocol: TCP
              port: 8000

      egress: []
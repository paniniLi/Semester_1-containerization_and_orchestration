##########################################
## Настройки Grafana
##########################################
grafana:
  enabled: true

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources: # список источников данных
        - name: Loki
          uid: loki
          type: loki
          access: proxy # запросы к Loki выполняет backend Grafana, а не браузер пользователя
          # Grafana и Loki развернуты одним Helm-релизом в одном namespace,
          # поэтому достаточно короткого DNS-имени сервиса. Имя релиза
          # Helm подставляет автоматически.
          url: 'http://{{ .Release.Name }}-loki-gateway'
          isDefault: false
          editable: false

        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: 'http://{{ .Release.Name }}-prometheus-server'
          isDefault: true
          editable: false

  sidecar: ## Настройки для автоматического создания dashboard с выбранными метриками
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: null
      resource: configmap
      provider:
        allowUiUpdates: false

## Параметры аутентификации задаются в файле grafana-secret.values.yaml и передаются в параметры обновления Helm-релиза.
## По-умолчанию включена автоматическая генерация пароля. Узнать пароль можно с помощью команды:
## kubectl get secret monitoring-grafana -n monitoring  -o jsonpath='{.data.admin-password}' | base64 -d
grafanaCredentials:
  create: false
  username: ""
  password: ""

##########################################
## Настройки Loki
##########################################
loki:
  enabled: false

##########################################
## Настройки Alloy
##########################################
alloy:
  enabled: false

##########################################
## Настройки Jaeger
##########################################
jaeger:
  enabled: false

##########################################
## Настройки JaegerUi
##########################################
jaegerUi:
  enabled: false

##########################################
## Настройки Prometheus
##########################################
prometheus:
  enabled: true

  alertmanager:
    enabled: false

  prometheus-pushgateway:
    enabled: true

  prometheus-node-exporter:
    enabled: false

  kube-state-metrics:
    enabled: true

  server:
    persistentVolume:
      enabled: false

  serverFiles:
    alerting_rules.yml:
      groups:
        - name: lab5-network-alerts
          rules:
            - alert: ShopNetworkPolicyDenied
              expr: sum(increase(hubble_drop_total{reason="POLICY_DENIED"}[5m])) > 0
              labels:
                severity: warning
                component: network-policy
              annotations:
                summary: "NetworkPolicy denied traffic"
                description: "Cilium detected traffic denied by Kubernetes NetworkPolicy."

            - alert: ShopDroppedTcpFlows
              expr: sum(increase(hubble_flows_processed_total{protocol="TCP",verdict="DROPPED"}[5m])) > 0
              labels:
                severity: warning
                component: network
              annotations:
                summary: "Dropped TCP flows detected"
                description: "Hubble detected dropped TCP connections in the cluster."

            - alert: ShopDnsFailures
              expr: sum(increase(coredns_dns_responses_total{rcode=~"SERVFAIL|REFUSED"}[5m])) > 0
              labels:
                severity: critical
                component: dns
              annotations:
                summary: "DNS failures detected"
                description: "CoreDNS returned SERVFAIL or REFUSED responses."

app:
  name: lab3-shop

image:
  repository:

postgres:
  instances: 1
  database: shop
  owner: shop
  storage:
    size: 1Gi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

migrations:
  image:
    repository: lab3-migration
    tag: "1.0"
    pullPolicy: IfNotPresent

  backoffLimit: 6
  activeDeadlineSeconds: 600

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
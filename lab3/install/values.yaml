app:
  name: lab3-shop

##########################################
## Параметры приложения API
##########################################
api:
  name: shop-api
  image:
    repository: lab3-shop-api
    version: "1.0"
    pullPolicy: IfNotPresent
  instances: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    port: 8080
    type: NodePort
    nodePort: 30080

##########################################
## Параметры приложения Worker
##########################################
worker:
  name: shop-worker
  image:
    repository: lab3-shop-worker
    version: "1.0"
    pullPolicy: IfNotPresent
  instances: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    port: 8080
    type: NodePort
    nodePort: 30081

##########################################
## Параметры СУДБ Postgres
##########################################
postgres:
  instances: 1
  database: shop
  owner: shop
  storage:
    size: 1Gi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi


##########################################
## Параметры Job по миграции схем данных
##########################################
migrations:
  name: shop-migrations
  image:
    repository: lab3-shop-migrations
    version: "1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  backoffLimit: 6
  activeDeadlineSeconds: 600
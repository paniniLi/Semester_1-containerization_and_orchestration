{{- if .Values.gate.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gate
  labels:
    app.kubernetes.io/name: shop-gate
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: shop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-gate
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-gate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: shop
    spec:
      serviceAccountName: {{ .Release.Name }}-gate
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gate
          image: "{{ .Values.gate.image.repository }}:{{ .Values.gate.image.version }}"
          imagePullPolicy: {{ .Values.gate.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PROMETHEUS_URL
              value: {{ .Values.gate.prometheusUrl | quote }}
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CHECK_INTERVAL_SECONDS
              value: {{ .Values.gate.intervalSeconds | quote }}
            - name: MIN_REQUESTS
              value: {{ .Values.gate.minRequests | quote }}
            - name: ERROR_THRESHOLD
              value: {{ .Values.gate.errorThreshold | quote }}
            - name: AVERAGE_LATENCY_THRESHOLD_SECONDS
              value: {{ .Values.gate.averageLatencyThresholdSeconds | quote }}
            - name: PROMOTION_STEP
              value: {{ .Values.gate.promotionStep | quote }}
          resources:
            {{- toYaml .Values.gate.resources | nindent 12 }}
{{- end }}

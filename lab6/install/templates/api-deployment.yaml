{{- $root := . -}}

{{- range $version, $config := .Values.api.versions }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-api-{{ $version }}
  labels:
    app.kubernetes.io/name: shop-api
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/part-of: shop # ресурс относится ко всей системе shop
    app.kubernetes.io/version: {{ $version | quote }}

spec:
  replicas: {{ $config.instances }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: shop-api
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/part-of: shop
      app.kubernetes.io/version: {{ $version | quote }}

  template:
    metadata: # метки создаваемых Pod-ов
      {{- if $root.Values.api.mesh.enabled }}
      annotations:
        linkerd.io/inject: "enabled"
      {{- end }}
      labels:
        app.kubernetes.io/name: shop-api
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/part-of: shop # ресурс относится ко всей системе shop
        app.kubernetes.io/version: {{ $version | quote }}
    spec:
      initContainers: # проверяем, применены ли изменения к схеме данных; до окончания их применения не запускаем приложение
        - name: wait-for-schema-migrations
          image: "{{ $root.Values.migrations.image.repository }}:{{ $root.Values.migrations.image.version }}"
          imagePullPolicy: {{ $root.Values.migrations.image.pullPolicy }}
          args:
            - "-connectRetries=60"
            - "validate"
          env:
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-postgres-app
                  key: jdbc-uri

            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-postgres-app
                  key: username

            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-postgres-app
                  key: password

          resources:
            {{- toYaml $root.Values.api.wait_for_schema_migrations.resources | nindent 12 }}

      containers:
        - name: api
          image: "{{ $root.Values.api.image.repository }}:{{ $root.Values.api.image.version }}"
          imagePullPolicy: {{ $root.Values.api.image.pullPolicy }}
          resources:
            {{- toYaml $root.Values.api.resources | nindent 12 }}

          ## Параметры подключения приложения к базе данных
          env:
            - name: DB_URL # JDBC-адрес PostgreSQL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-postgres-app
                  key: jdbc-uri

            - name: DB_USER # пользователь базы
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-postgres-app
                  key: username

            - name: DB_PASSWORD # пароль пользователя базы
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-postgres-app
                  key: password

            - name: API_VERSION
              value: {{ $version | quote }}

            - name: FAIL
              value: {{ $config.fail | quote }}

            - name: FLAKY
              value: {{ $config.flaky | quote }}

          ports:
            - name: http
              containerPort: {{ $root.Values.api.service.port }}
          readinessProbe: # параметры для readiness-пробы
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe: # параметры для liveness-пробы
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
{{- end }}
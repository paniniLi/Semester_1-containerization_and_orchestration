
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: shop-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: shop

spec:
  replicas: {{ .Values.api.instances }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: shop-api
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/part-of: shop

  template:
    metadata:
      {{- if .Values.api.mesh.enabled }}
      annotations:
        linkerd.io/inject: "enabled"
      {{- end }}
      labels:
        app.kubernetes.io/name: shop-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: shop

    spec:
      initContainers:
        - name: wait-for-schema-migrations
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.version }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          args:
            - "-connectRetries=60"
            - "validate"
          env:
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: jdbc-uri

            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: username

            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: password

          resources:
            {{- toYaml .Values.api.wait_for_schema_migrations.resources | nindent 12 }}

      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.version }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: jdbc-uri

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: password

            - name: HEALTH_FAIL
              value: "{{ .Values.api.health_fail }}"

            - name: FLAKY
              value: "{{ .Values.api.flaky }}"

          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10

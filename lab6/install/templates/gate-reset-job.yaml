{{- if and .Values.gate.enabled .Values.api.trafficSplit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-gate-reset
  labels:
    app.kubernetes.io/name: shop-gate-reset
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: shop
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-gate-reset
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: shop
    spec:
      serviceAccountName: {{ .Release.Name }}-gate
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reset-weights
          image: "{{ .Values.gate.image.repository }}:{{ .Values.gate.image.version }}"
          imagePullPolicy: {{ .Values.gate.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: RESET_WEIGHTS
              value: "true"
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INITIAL_V1_WEIGHT
              value: {{ .Values.api.trafficSplit.v1Weight | quote }}
            - name: INITIAL_V2_WEIGHT
              value: {{ .Values.api.trafficSplit.v2Weight | quote }}
          resources:
            {{- toYaml .Values.gate.resources | nindent 12 }}
{{- end }}

##########################################
## Параметры приложения API
##########################################
api:
  image:
    repository: shop-api
    version: "lab6"
    pullPolicy: IfNotPresent
  versions:
    v1:
      instances: 0
      fail: false
      flaky: false
    v2:
      instances: 1
      fail: false
      flaky: false
  stableVersion: v2
  mesh:
    enabled: true
  trafficSplit:
    enabled: false
    v1Weight: 90
    v2Weight: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  wait_for_schema_migrations:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  service:
    port: 8080
    type: NodePort
    nodePort: 30082
  retry:
    enabled: false
    limit: 2

##########################################
## Параметры script-gate
##########################################
gate:
  enabled: false
  image:
    repository: shop-gate
    version: "lab6"
    pullPolicy: IfNotPresent
  prometheusUrl: http://monitoring-prometheus-server.monitoring.svc.cluster.local # URL для получения метрик Prometheus внутри gate
  intervalSeconds: 15 # интервал проверки работоспособности v1/v2 версий api
  minRequests: 20 # минимальное количество запросов для принятия решения об изменении весов v1/v2
  errorThreshold: 0.05 # допустимый порог ошибок v2 до отката
  averageLatencyThresholdSeconds: 0.5 # допустимая средняя задержка v2 до отката
  promotionStep: 10 # шаг увеличения доли трафика, направленного на v2 при успешной проверке
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

##########################################
## Параметры приложения Worker
##########################################
worker:
  image:
    repository: lab3-worker
    version: "1.0"
    pullPolicy: IfNotPresent
  instances: 0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  wait_for_schema_migrations:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  service:
    port: 8080
    type: NodePort
    nodePort: 30083

##########################################
## Параметры СУДБ Postgres
##########################################
postgres:
  instances: 1
  database: shop
  owner: shop
  storage:
    size: 1Gi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi


##########################################
## Параметры Job по миграции схем данных
##########################################
migrations:
  image:
    repository: lab3-migration
    version: "1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  backoffLimit: 6
  activeDeadlineSeconds: 600

##########################################
## Prometheus Operator compatibility
##########################################
monitoring:
  prometheusOperator:
    enabled: false
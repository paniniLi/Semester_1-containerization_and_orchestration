kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        apiVersion: kubelet.config.k8s.io/v1beta1
        kind: KubeletConfiguration
        evictionHard:
          memory.available: "10Gi"
          imagefs.available: "0%"
          nodefs.available: "0%"
          nodefs.inodesFree: "0%"
        evictionMinimumReclaim:
          memory.available: "1Gi"
  - role: worker
  - role: worker
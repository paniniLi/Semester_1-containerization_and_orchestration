{{- if .Values.monitoring.prometheusOperator.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: shop
spec:
  groups:
    - name: lab4-shop-alerts
      rules:
        - alert: ShopApiDown
          expr: |
            (up{namespace="{{ .Release.Namespace }}", service="{{ .Release.Name }}-api"} == 0)
            or
            absent(up{namespace="{{ .Release.Namespace }}", service="{{ .Release.Name }}-api"})
          for: 30s
          labels:
            severity: critical
            component: api
          annotations:
            summary: "Shop API is unavailable"
            description: "Prometheus cannot scrape the critical API for at least 30 seconds."

        - alert: ShopOrderLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_server_requests_seconds_bucket{
                  namespace="{{ .Release.Namespace }}",
                  service="{{ .Release.Name }}-api",
                  uri="/order",
                  method="POST",
                  status="201"
                }[5m])
              )
            ) > 0.2
          for: 1m
          labels:
            severity: warning
            component: api
          annotations:
            summary: "Order API p95 latency exceeds SLA"
            description: "The p95 latency of POST /order is above 200 ms for at least one minute."

        - alert: ShopBatchDegraded
          expr: |
            kube_deployment_spec_replicas{
              namespace="{{ .Release.Namespace }}",
              deployment="{{ .Release.Name }}-batch"
            }
            >
            kube_deployment_status_replicas_ready{
              namespace="{{ .Release.Namespace }}",
              deployment="{{ .Release.Name }}-batch"
            }
          for: 30s
          labels:
            severity: warning
            component: batch
          annotations:
            summary: "Batch workload is degraded"
            description: "The number of ready batch replicas is lower than the desired number for at least 30 seconds."
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: shop-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: shop # ресурс относится ко всей системе shop
spec:
  replicas: {{ .Values.api.instances }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: # какие Pod-ы будут учитываться при подсчете количества реплик
      app.kubernetes.io/name: shop-api
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/part-of: shop
  template:
    metadata: # метки создаваемых Pod-ов
      labels:
        app.kubernetes.io/name: shop-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: shop # ресурс относится ко всей системе shop
    spec:
      priorityClassName: {{ .Values.api.priorityClassName }}

      {{- if eq .Values.api.spreadMechanism "topologySpreadConstraints" }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          nodeTaintsPolicy: Honor
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: shop-api
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- else if eq .Values.api.spreadMechanism "podAntiAffinity" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: shop-api
                    app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}

      initContainers: # проверяем, применены ли изменения к схеме данных; до окончания их применения не запускаем приложение
        - name: wait-for-schema-migrations
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.version }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          args:
            - "-connectRetries=60"
            - "validate"
          env:
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: jdbc-uri
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: username

            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: password
          resources:
            {{- toYaml .Values.api.wait_for_schema_migrations.resources | nindent 12 }}

      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.version }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          resources:
            {{ toYaml .Values.api.resources | nindent 12 }}

          ## Параметры подключения приложения к базе данных
          env:
            - name: DB_URL # JDBC-адрес PostgreSQL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: jdbc-uri

            - name: DB_USER # пользователь базы
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: username

            - name: DB_PASSWORD # пароль пользователя базы
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: password

            - name: HEALTH_FAIL
              value: "{{ .Values.api.health_fail }}"

          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
          readinessProbe: # параметры для readiness-пробы
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe: # параметры для liveness-пробы
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
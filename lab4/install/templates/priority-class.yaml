{{- if .Values.priorityClasses.enabled }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.critical.name }}
value: {{ .Values.priorityClasses.critical.value }}
globalDefault: false # priorityClass не назначается автоматически подам, у которых не указан priorityClassName
preemptionPolicy: {{ .Values.priorityClasses.critical.preemptionPolicy }}
description: "Critical shop workloads"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.background.name }}
value: {{ .Values.priorityClasses.background.value }}
globalDefault: false
preemptionPolicy: {{ .Values.priorityClasses.background.preemptionPolicy }}
description: "Background shop workloads"
{{- end }}
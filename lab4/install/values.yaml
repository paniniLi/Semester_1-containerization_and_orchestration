##########################################
## Параметры приложения API
##########################################
api:
  image:
    repository: lab3-api
    version: "1.0"
    pullPolicy: IfNotPresent
  instances: 3
  spreadMechanism: topologySpreadConstraints
  resources: # обеспечиваем QoS Guaranteed: requests = limits
    requests:
      cpu: 500m
      memory: 261Mi
    limits:
      cpu: 500m
      memory: 261Mi
  wait_for_schema_migrations:
    resources: # обеспечиваем QoS Guaranteed: requests = limits
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi
  service:
    port: 8080
    type: NodePort
    nodePort: 30082
  health_fail: false
  priorityClassName: shop-critical
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

##########################################
## Параметры приложения Worker
##########################################
worker:
  image:
    repository: lab3-worker
    version: "1.0"
    pullPolicy: IfNotPresent
  instances: 2
  resources:
    requests:
      cpu: 10m
      memory: 228Mi
    limits:
      cpu: 500m
      memory: 228Mi
  wait_for_schema_migrations:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  service:
    port: 8080
    type: NodePort
    nodePort: 30083


##########################################
## Параметры приложения аналитики Batch
##########################################
batch:
  image:
    repository: lab4-batch
    version: "1.0"
    pullPolicy: IfNotPresent
  instances: 1
  resources: # обеспечиваем QoS Burstable: requests < limits
    requests:
      cpu: 380m
      memory: 367Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    port: 8080
  batch_cpu_threads: 1
  batch_memory_megabytes: 128
  priorityClassName: shop-background
  podDisruptionBudget:
    enabled: true

##########################################
## Параметры СУДБ Postgres
##########################################
postgres:
  instances: 1
  database: shop
  owner: shop
  storage:
    size: 1Gi
    storageClass: standard
  resources: # обеспечиваем QoS Guaranteed: requests = limits
    requests:
      cpu: 500m
      memory: 153Mi
    limits:
      cpu: 500m
      memory: 153Mi
  priorityClassName: shop-critical
  podDisruptionBudget:
    enabled: true


##########################################
## Параметры Job по миграции схем данных
##########################################
migrations:
  image:
    repository: lab3-migration
    version: "1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  backoffLimit: 6
  activeDeadlineSeconds: 1200


##########################################
## Параметры PriorityClass
##########################################
priorityClasses:
  enabled: true

  critical:
    name: shop-critical
    value: 100000
    preemptionPolicy: PreemptLowerPriority

  background:
    name: shop-background
    value: -1000
    preemptionPolicy: PreemptLowerPriority

##########################################
## Prometheus Operator compatibility
##########################################
monitoring:
  prometheusOperator:
    enabled: false